<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Texas Temperature Trend Placeholder</title>
  <desc id="desc">A placeholder line chart showing an upward trend in average temperature over time.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef6fb"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="620" fill="url(#bg)" />

  <g opacity="0.5" stroke="#c3d7e5" stroke-width="2">
    <line x1="120" y1="520" x2="1120" y2="520" />
    <line x1="120" y1="430" x2="1120" y2="430" />
    <line x1="120" y1="340" x2="1120" y2="340" />
    <line x1="120" y1="250" x2="1120" y2="250" />
    <line x1="120" y1="160" x2="1120" y2="160" />
    <line x1="120" y1="70" x2="1120" y2="70" />
  </g>

  <g stroke="#8eaec2" stroke-width="3">
    <line x1="120" y1="70" x2="120" y2="520" />
    <line x1="120" y1="520" x2="1120" y2="520" />
  </g>

  <polyline
    fill="none"
    stroke="url(#line)"
    stroke-width="8"
    stroke-linecap="round"
    stroke-linejoin="round"
    points="140,470 200,465 260,455 320,460 380,440 440,430 500,420 560,410 620,395 680,385 740,360 800,335 860,315 920,280 980,255 1040,220 1100,190"
  />

  <g fill="#2e4a5d" font-family="Arial, sans-serif" font-size="24" font-weight="600">
    <text x="550" y="42">Average Texas Temperature Trend (Placeholder)</text>
  </g>

  <g fill="#4b6476" font-family="Arial, sans-serif" font-size="20">
    <text x="1080" y="548">Year</text>
    <text x="30" y="58" transform="rotate(-90 30 58)">Temperature</text>
    <text x="125" y="554">1900</text>
    <text x="375" y="554">1930</text>
    <text x="625" y="554">1960</text>
    <text x="875" y="554">1990</text>
    <text x="1085" y="554">2020</text>
  </g>
</svg>
